# 复制本文件为 config.ini 后填写。
# config.ini 与 *.session 含敏感信息（等于登录态），务必 chmod 600、切勿泄露或上传。

[telegram]
# 在 https://my.telegram.org → API development tools 申请
api_id = 123456
api_hash = 0123456789abcdef0123456789abcdef
# 登录态文件名（运行后生成 <session_name>.session）
session_name = tg_saved
# 监听源：me = 你的「收藏」(Saved Messages)；也可填频道 @用户名 或 -100xxxxxxxxxx
source = me
# 启动时回扫最近 N 条补漏（0 = 只处理今后的新消息，避免一上来下载一堆历史）
backfill_limit = 0

[rclone]
# rclone 可执行路径（已在 PATH 里就填 rclone）
rclone_path = rclone
# rclone config 里配好的 OneDrive remote 名字
remote = onedrive
# 上传到 OneDrive 的目标目录，必须落在 91 项目 OneDrive drive 的 rootID(默认 root) 之下；
# 留空 = 传到网盘根目录
dest_dir = Telegram

[download]
# 本地临时目录（下载到这里，上传成功后自动删除；相对路径基于脚本所在目录）
tmp_dir = tmp
# 两次处理之间的最小间隔秒数（控速，防 FloodWait / 平滑 CPU/IO）
min_interval_sec = 5
# 跳过超过该大小(MB)的视频，0 = 不限制（Premium 单文件上限 4GB，免费号 2GB）
max_filesize_mb = 0
# 并行下载连接数：仅在 Telegram Premium 下建议 >1（免费号并行易触发 FloodWait）。
# 1=单连接(默认旧行为)；4≈4MiB/s；8≈7MiB/s。撞 FloodWait 就调小。
connections = 8

[state]
# 去重记录文件（保存已处理的 message id）
processed_file = processed.json
